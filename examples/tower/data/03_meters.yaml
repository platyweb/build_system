    - {id: 31, tag: L02 West Small Power, base: 13100, type: Modbus, parent: 1, function: Small Power, utility: electricity, tenant_display: yes}
  East:
    - {id: 32, tag: L02 East Lighting, base: 13200, type: Modbus, parent: 1, function: Lighting, utility: electricity, tenant_display: yes}
    - {id: 33, tag: L02 East Small Power, base: 13300, type: Modbus, parent: 1, function: Small Power, utility: electricity, tenant_display: yes}

floor_L03:
