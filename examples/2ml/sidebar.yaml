# ─────────────────────────────────────────────────────────────────────────────
# Main sidebar navigation → SIDEBAR_HTML in js/project/2.0/sidebar-template.js
# (between the BEGIN/END GENERATED SIDEBAR_HTML markers). The runtime behaviour
# below the END marker (theme toggle, active-page highlight) is hand-maintained.
#
# Item shapes:  { label, href, icon?, target?, rel?, class? }   — leaf
#               { label, icon, children: [ … ] }                — sub-menu
#               { auto: floors|incomers|switchboards|tenants }  — derived list
#               { auto: …, only: [key, …] }                     — filter + reorder the derived list
#               { auto: …, groups: [{label, from, to}, …] }     — bucket the derived list into
#                                                                  labelled range sub-menus (e.g.
#                                                                  "Floors 37th - 47th") instead of
#                                                                  one flat list. from/to are the
#                                                                  derived list's own keys (e.g. floor
#                                                                  ordinals), inclusive; a boundary
#                                                                  key this site doesn't have drops
#                                                                  that whole group rather than
#                                                                  emitting a dead link. Omit `groups`
#                                                                  for sites that just want every item
#                                                                  listed flat — it's opt-in per site.
#               { kind: theme_toggle }                          — theme switcher
# brand + footer come from _data/building.yaml.
# ─────────────────────────────────────────────────────────────────────────────

top_items:
  - { label: Estate, icon: bx-home, href: "/page?dds=lbc_estate/home" }

bottom_items:
  - { label: Logout, icon: bxs-user, href: "/Login.html?logout", class: menu-logout }

sections:
  - header: METERING
    items:
      - label: Floors
        icon: bxs-building
        children:
          - auto: floors
      - label: Incomers
        icon: bxs-building-house
        children:
          - { auto: incomers, only: [electricity, gas, water] }
      - label: Meters
        icon: bx-tachometer
        children:
          - { label: "Hierarchy tree",  href: meters_hierarchy.htm }
          - { label: "Meter Displays",  href: "/meters/MeterDisplayManager.html?hideup", target: _blank, rel: noopener }

  - header: INSIGHTS
    items:
      - label: Reports
        icon: bx-bar-chart
        children:
          - { label: "Baseline Reporting", href: "report_template.htm?title=Baseline Report&href=/utilityReports/UtilityReports.html?libraryItemId=143&imageSrc=baseline", target: _blank }
          - { label: "Occupancy Analysis", href: "report_template.htm?title=Occupancy Analysis&href0=/utilityReports/UtilityReports.html?libraryItemId=144&imageSrc0=occupancyAnalysis_elec&label0=Electricity Occupancy&href1=/utilityReports/UtilityReports.html?libraryItemId=164&imageSrc1=occupancyAnalysis_gas&label1=Gas Occupancy&href2=/utilityReports/UtilityReports.html?libraryItemId=158&imageSrc2=occupancyAnalysis_chw&label2=CHW Occupancy&href3=/utilityReports/UtilityReports.html?libraryItemId=162&imageSrc3=occupancyAnalysis_lphw&label3=LPHW Occupancy", target: _blank }
          - { label: "Annual Overview",    href: "report_template.htm?title=Annual Overview&href=/utilityReports/UtilityReports.html?libraryItemId=127&imageSrc=annualOverview", target: _blank }
          - { label: "Degree Days",        href: "report_template.htm?title=Degree Days&href=/utilityReports/UtilityReports.html?libraryItemId=170&imageSrc=degreeDays", target: _blank }
          - { label: "Report Wizard",      href: "/utilityReports/UtilityReports.html?hideup", target: _blank, rel: noopener }

  - header: BILLING
    items:
      - label: Tenants
        icon: bxs-user-badge
        children:
          - { label: "Tenants Summary",      href: tenants.htm }
          - { auto: tenants }

  - header: MISC
    items:
      - { label: Alarms, icon: bxs-bell-ring, href: "/alarmNotifications/?hideup", target: _blank, rel: noopener }
      - label: Docs
        icon: bxs-file-doc
        children:
          - { label: "Meter Manuals",    href: docs_meters.htm }
          - { label: "Network",          href: "/docs/manuals/network_schedule.pdf",         target: _blank, rel: noopener }
          - { label: "Optergy",          href: "/docs/manuals/optergy_doo.pdf",              target: _blank, rel: noopener }
          - { label: "Tariff Structure", href: "/docs/manuals/tenant_billing_schematic.pdf", target: _blank, rel: noopener }

  - header: SETTINGS
    items:
      - { kind: theme_toggle }
