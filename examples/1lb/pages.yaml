# ─────────────────────────────────────────────────────────────────────────────
# Singleton / one-off pages rendered through _templates/page.html.j2 + base.
# Body and head/script extras live in _templates/pages/<key>.*.html fragments;
# this file carries only per-page metadata. Generated by _build/extract_pages.py
# then hand-maintained. To edit a page, edit its fragment and rebuild.
# ─────────────────────────────────────────────────────────────────────────────

pages:
  - key: landlord_tenant
    out: landlord_tenant.htm
    page_title: "Landlord Tenant Split · {{ building.ems_name }}"
    heading: "Landlord Tenant Split"
    container_style: "display: flex; flex-direction: column; gap: 15px;"
  - key: docs_meters
    out: docs_meters.htm
    page_title: "Meter Documentation · {{ building.ems_name }}"
    heading: "Meter Documentation"
    container_style: "display: flex; flex-direction: column; gap: 15px;"
  - key: docs_manuals
    out: docs_manuals.htm
    page_title: "Landlord Services · {{ building.ems_name }}"
    heading: "Landlord Services"
    container_style: "display: flex; flex-direction: column; gap: 15px;"
  - key: report_template
    out: report_template.htm
    page_title: "Report · {{ building.ems_name }}"
    heading: ""
    container_style: "display: flex; flex-direction: column; gap: 15px;"
    no_optergy: true
  - key: home
    out: home.htm
    page_title: "Home · {{ building.ems_name }}"
    heading: "{{ building.name }} Energy Management System"