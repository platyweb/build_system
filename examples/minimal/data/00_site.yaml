# ─────────────────────────────────────────────────────────────────────────────
# MINIMAL EXAMPLE SITE — a single-storey depot.
#
# The smallest site the engine builds: one level, three incomers (electricity,
# gas, water), a home page, the meters hierarchy and a building performance
# page — no tenants, switchboards or risers. Start a new building from it:
#
#     cp -r examples/minimal site      # then edit site/, build, snapshot
#
# Everything about one building lives in its site directory:
#   data/       numbered in the order to fill them in: 00_site.yaml (this
#               file — identity, BACnet addressing), 01_pages.yaml (the pages
#               to build, as the menu), 02_floors.yaml (level roster),
#               03_meters.yaml (meters by level → core), then one YAML per
#               kind of page listed
#   pages/      HTML fragments for the site's own pages and extras (none here)
#   templates/  overrides of the engine's _templates/ (none here)
#   assets/     site images copied over _assets/ (none here)
#   golden/     regression manifests (_build/regress.py)
# ─────────────────────────────────────────────────────────────────────────────

# Output directory name: project/<slug>/.
slug: "acme-depot"

name: "Acme Depot"
short_name: "AD"
postcode: "AB1 2CD"
net_internal_area: "2,400 m²"
# Suffix for browser-tab titles, e.g. "Ground Floor Overview · AD EMS".
ems_name: "AD EMS"

# The pages to build, and the menu, are data/01_pages.yaml.

# Utilities this site meters, in display order. The code is what a meter's
# utility (data/03_meters.yaml) resolves to (a code or label, any case; "Fluid energy" picks the
# thermal code named in the meter's function) and the CSS class .meter-<code>;
# the label names it on pages; kind (electric | thermal | other) groups
# utilities for the zone-card subtitles.
utilities:
  electricity: {label: Electricity, kind: electric}
  solar:       {label: Solar PV, kind: electric}
  gas:         {label: Gas, kind: other}
  water:       {label: Water, kind: other}

# Cache-busting version on the Optergy controller's own /js/* libraries.
optergy_lib_version: "260228085300"

# BACnet point addressing — "<device>|<object type>|<instance>|85|-1". A
# meter's demand point is instance base + power_offset[its type].
bacnet:
  device: 300
  power_offset:
    Modbus: 40
    Calculation: 82

# Sidebar brand block (logo + label, links home) and footer contact.
brand:
  href: home.htm
  label: "Acme Depot"
  logo_src: img/favicon.png
footer:
  logo: img/favicon.png
  logo_alt: "Acme"
  email: facilities@example.com

# Summary-card catalog: role → card title + display format. A floor_page tab
# lists roles; each card's live point is data/04_points.yaml `floors:` for
# (floor, role) — none shows "N/A".
summary_roles:
  floor_today_electricity: {title: "Today's Consumption", format: energy}
  floor_solar_demand:      {title: "Solar Output",        format: power}
  floor_today_solar:       {title: "Today's Generation",  format: energy}

# Floor pages. Everything here is optional; an office tower would also set
# tenant/landlord summary cards, a centre_zone + zone_suffix for its riser,
# zone_subtitles and more tabs (heating, cooling, ventilation).
floor_page:
  # Riser cards on floor pages link here ("#" = not a link).
  riser_card_link: "#"
  # Card beside the floorplan: the meter whose `function` is this name.
  summary_cards:
    total: "Floor Total Electricity"
  # Layout, here at its defaults; a level in 02_floors.yaml may set its own.
  # floorplan: right        # right (beside the cards) | top | none
  # meter_columns: 3        # 1-4, or auto: as many as the floor's meters use
  # summary_layout: split   # split (total, then tenants + landlords) | row
  # Report tabs: summary cards for `roles`, then the reports.yaml placements
  # for page=floor, floor=<key>, slot=<slot>, titled by position.
  report_titles: [Demand, Consumption]
  tabs:
    - { id: electricity-report, label: "Electricity", slot: electricity, roles: [floor_today_electricity] }
    - { id: solar-report,       label: "Solar PV",    slot: solar,       roles: [floor_solar_demand, floor_today_solar] }
