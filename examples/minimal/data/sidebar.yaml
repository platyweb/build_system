# Main sidebar → SIDEBAR_HTML in js/project/2.0/sidebar-template.js.
# `auto:` lists are derived from the site's data (floors = the levels with
# pages in floors.yaml, top first; incomers = incomers.yaml). brand + footer
# come from site.yaml. An `auto:` item also takes groups:/only: (floor
# sub-menus, a subset); see examples/campus for per-building sub-menus.

top_items:
  - { label: Home, icon: bxs-home, href: home.htm }

bottom_items:
  - { label: Logout, icon: bxs-user, href: "/Login.html?logout", class: menu-logout }

sections:
  - header: METERING
    items:
      - label: Floors
        icon: bxs-building
        children:
          - { auto: floors }
      - label: Incomers
        icon: bxs-building-house
        children:
          - { auto: incomers }
      - label: Meters
        icon: bx-tachometer
        children:
          - { label: "Hierarchy tree", href: meters_hierarchy.htm }
      - label: Performance
        icon: bx-star
        children:
          - { label: "Building Performance", href: building_performance.htm }

  - header: SETTINGS
    items:
      - { kind: theme_toggle }
