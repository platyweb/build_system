# ─────────────────────────────────────────────────────────────────────────────
# FLOOR ROSTER + per-floor data not derivable from the meter registry
# (meters.csv), bms_bindings.yaml, or reports.yaml.
#
# This is the site's LEVEL ROSTER: one top-level `floor_<key>:` entry per
# level, listed bottom → top. The order of the entries IS the physical order
# — the sidebar, tenant floor lists and riser diagrams all follow it — so keys
# can be named anything ("ground"/"1st", "L00", "Mezzanine", "Roof"). Every
# floor named anywhere else (meters.csv, bms_bindings.yaml, reports.yaml,
# tenants.yaml, sidebar.yaml groups, energy_flow.yaml) must be a level here;
# `build.py --check` reports any that aren't.
#
# Each level gets one generated `floor_<key>.htm` page unless it sets
# `page: false` (a level with meters but no page of its own, like the
# basement plant levels below). The sidebar's `auto: floors` list is built
# from the levels with pages, top floor first.
#
# Roster fields (all optional):
#   label     → display name: tenant pages, floor lists      (default: the key)
#   nav_label → sidebar menu text                              (default: label)
#   heading   → the floor page's heading          (default: "<label> Overview")
#   page      → false for a level with no page                 (default: true)
#
# A level with a page only renders if the meter registry has meters pinned to
# it (floor=<key>) so its layout can be derived — or the entry supplies an
# explicit `floorplan_tab.layout:`. A page level with neither is an error by
# design (nothing to draw).
#
# Page data (any other field is passed to the floor page):
#   tenants                         (string) → occupant name, carried for
#                                     reference/tenant-page generation (not
#                                     rendered on the floor page itself)
#
# Derived automatically (override allowed by setting the field in YAML):
#   tabs                            → Summary + the report tabs in site.yaml
#                                     floor_page.tabs (St Peters: Electricity /
#                                     Heat / Cooling / Ventilation Report)
#   floorplan_image                 → img/floors/floor_<key>.png
#   floorplan_tab.layout            → group meters by (floor, column, zone), sort by
#                                     position, insert floorplan after column 0
#
# Each report tab shows its summary cards (site.yaml floor_page.tabs roles,
# titled from `summary_roles:`, bound per floor in `data/bms_bindings.yaml`)
# then the `data/reports.yaml` placements for page=floor, floor=<key>,
# slot=<the tab's slot>.
#
# Override hooks:
#   floorplan_tab.floorplan_after_column: 1  # shift floorplan one column right
#   floorplan_tab.layout: …                  # bypass layout derivation
# ─────────────────────────────────────────────────────────────────────────────

