# ─────────────────────────────────────────────────────────────────────────────
# DATA FILE 00 — fill in first. Site facts for site1: what makes a directory a
# site directory (build.py --site DIR, default site/). The other data files
# follow in number order; the meters come straight from data/meters.csv (an
# export, dropped in as it is).
#
# Available to every template as the `building` global.
# ─────────────────────────────────────────────────────────────────────────────

# Output directory name: project/<slug>/.
slug: "site1"

name: "site1"
short_name: "site1"
# Suffix for browser-tab titles, e.g. "2nd Floor Overview · site1 EMS".
ems_name: "site1 EMS"

# Utilities this site meters, in display order. A meter's `utility` cell
# resolves to one of these codes (a code or label, any case); the code is
# also the CSS class .meter-<code>. kind: electric | thermal | other.
utilities:
  electricity: {label: Electricity, kind: electric}

# Cache-busting version on the Optergy controller's own /js/* libraries.
optergy_lib_version: "260228085300"

# BACnet addressing. A meter's live demand is analog value
# base + power_offset[its type] on this device; its status is binary value
# base. Every meter type in meters.csv needs an offset.
# TODO: confirm the device and offsets for this building's controller.
bacnet:
  device: 300
  power_offset:
    Modbus: 40
    Calculation: 82

# Menu brand block (logo + label). The logo links to the main incomer.
brand:
  href: incomer_electricity.htm
  label: "site1"
  logo_src: img/favicon.png

# Menu footer: the facilities contact. TODO: the building's real contact.
footer:
  logo: img/favicon.png
  logo_alt: "site1"
  email: facilities@example.com

# Floor pages: each level's card(s) come from meters.csv; `total` names the
# function of the meter whose demand heads the page.
floor_page:
  riser_card_link: "#"
  summary_cards:
    total: "Floor Total Electricity"
  report_titles: [Demand, Consumption]
  tabs:
    - { id: electricity-report, label: "Electricity", slot: electricity }
