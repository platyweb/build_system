# ─────────────────────────────────────────────────────────────────────────────
# DATA FILE 02 — fill in after 00_site.yaml and 01_pages.yaml. 03_meters.yaml comes next:
# its levels and cores are the ones defined here.
#
# FLOOR ROSTER + TENANTS + per-floor data not derivable from the meters
# (03_meters.yaml), bms_bindings.yaml, or reports.yaml.
#
# This is the site's LEVEL ROSTER: one top-level `floor_<key>:` entry per
# level, listed bottom → top. The order of the entries IS the physical order
# — the sidebar, tenant floor lists and riser diagrams all follow it — so keys
# can be named anything ("ground"/"1st", "L00", "Mezzanine", "Roof"). Every
# floor named anywhere else (03_meters.yaml, bms_bindings.yaml, reports.yaml,
# the tenants below, sidebar.yaml groups, energy_flow.yaml) must be a level
# here; `build.py --check` reports any that aren't.
#
# The one other top-level key, `tenants:`, is the tenant catalog (below).
#
# Each level gets one generated `floor_<key>.htm` page unless it sets
# `page: false` (a level with meters but no page of its own, like the
# basement plant levels below). The sidebar's `auto: floors` list is built
# from the levels with pages, top floor first.
#
# Roster fields (all optional):
#   label     → display name: tenant pages, floor lists      (default: the key)
#   nav_label → sidebar menu text                              (default: label)
#   heading   → the floor page's heading          (default: "<label> Overview")
#   page      → false for a level with no page                 (default: true)
#   cores     → {<core>: <tenant short name>}: who holds each core. St
#               Peters' cores are the floor-page cards (North / West / East)
#               that 03_meters.yaml groups each level's meters into; a core
#               left out is the landlord's. A core's meters take its tenant. `--check` warns when a
#               meter's tenant tag doesn't match the core it sits in (or,
#               for a meter outside the cores, any core on its floor). No
#               page shows cores yet.
#
# A level with a page only renders if the meter registry has meters pinned to
# it (floor=<key>) so its layout can be derived — or the entry supplies an
# explicit `floorplan_tab.layout:`. A page level with neither is an error by
# design (nothing to draw).
#
# Derived automatically (override allowed by setting the field in YAML):
#   tabs                            → Summary + the report tabs in site.yaml
#                                     floor_page.tabs (St Peters: Electricity /
#                                     Heat / Cooling / Ventilation Report)
#   floorplan_image                 → img/floors/floor_<key>.png
#   floorplan_tab.layout            → group meters by (floor, column, zone), sort by
#                                     position, insert floorplan after column 0
#
# Each report tab shows its summary cards (site.yaml floor_page.tabs roles,
# titled from `summary_roles:`, bound per floor in `data/bms_bindings.yaml`)
# then the `data/reports.yaml` placements for page=floor, floor=<key>,
# slot=<the tab's slot>.
#
# Override hooks:
#   floorplan_tab.floorplan_after_column: 1  # shift floorplan one column right
#   floorplan_tab.layout: …                  # bypass layout derivation
# ─────────────────────────────────────────────────────────────────────────────

# ─── Tenants ──────────────────────────────────────────────────────────────────
# One entry per tenant, keyed by its SHORT NAME: what a level's `cores:`
# names and a meter's `tenant:` (03_meters.yaml) spells. Fields:
#   name           → proper name: "Tenant" card, page titles, sidebar
#                    (default: the short name)
#   slug           → output folder, tenants/<slug>/ (default: the short name
#                    lower-cased, other characters → "-"). Set only where
#                    that default isn't the folder you want.
#   index: {}      → also builds the tenant's index.htm (multi-floor tenants)
#   extra_floors / exclude_floors / floors.<key>.{heading,
#                    floorplan_tab_label} → see README "data/floors.yaml"
#
# Entry order is the sidebar's tenant order. A tenant's pages show the meters
# tagged with its short name and `tenant_display: yes`, on the floors those
# meters name. Landlords / Main Reception / "Mezzanine of retail units" are
# common areas, not tenants, so they have no entry (their meters show on no
# tenant page).
#
# Roster reconciled against "tenants/List of tennants.xlsx" + meters.csv.
# The `tenants` module is still off in site.yaml `modules:` pending further
# reconciliation — this block is data-only until it's enabled.
