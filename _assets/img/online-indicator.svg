<?xml version="1.0" encoding="UTF-8"?>
<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradient for online state -->
  <defs>
    <radialGradient id="onlineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Online Indicator -->
  <g id="onlineIndicator">
    <!-- Glow effect -->
    <circle cx="10" cy="10" r="8" fill="url(#onlineGlow)" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Main circle -->
    <circle cx="10" cy="10" r="5" fill="url(#onlineGlow)" stroke="#4ade80" stroke-width="1" />
  </g>
</svg>
